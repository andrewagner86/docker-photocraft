server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Korrekte MIME-Typen sind Pflicht: ohne application/wasm kann der Browser
    # das WebAssembly nicht streamend kompilieren.
    types {
        text/html                 html htm;
        text/css                  css;
        text/javascript           js mjs;
        application/wasm          wasm;
        application/json          json map;
        application/manifest+json webmanifest;
        image/svg+xml             svg;
        image/png                 png;
        image/x-icon              ico;
        text/plain                txt md;
    }
    default_type application/octet-stream;

    # Kompression: reduziert den .wasm-Download von ~23 MiB auf ~10,5 MiB.
    # gzip_static liefert die beim Build erzeugten .gz-Dateien aus;
    # gzip on bleibt Rückfall für Dateien ohne vorkomprimierte Variante.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/wasm text/javascript text/html text/css application/json image/svg+xml;

    # Es werden keine Isolations-Header (COOP/COEP) benötigt.
    # X-Frame-Options: DENY darf NICHT gesetzt werden (Einbettung per iframe).

    # Healthcheck für Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dateinamen von .wasm/.js enthalten einen Content-Hash -> dauerhaft cachebar
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html immer neu validieren, damit neue Versionen ankommen
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
