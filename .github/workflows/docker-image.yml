name: Docker Hub veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - docker-compose.yml
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - nginx.conf
      - docker-compose.yml
      - .github/workflows/docker-image.yml
  # Wöchentlicher Neubau, damit Sicherheitsupdates der Basis-Images ankommen
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      photocraft_version:
        description: "PhotoCraft-Version (leer = Standardwert aus dem Dockerfile)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: photocraft

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: PhotoCraft-Version bestimmen
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.photocraft_version }}
        run: |
          version="${INPUT_VERSION:-$(grep -m1 '^ARG PHOTOCRAFT_VERSION=' Dockerfile | cut -d= -f2)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültige Version: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Image-Tag in docker-compose.yml prüfen
        if: inputs.photocraft_version == ''
        run: |
          dockerfile_version="$(grep -m1 '^ARG PHOTOCRAFT_VERSION=' Dockerfile | cut -d= -f2)"
          compose_version="$(grep -m1 -E '^\s*image:.*/photocraft:' docker-compose.yml | sed -E 's/.*:([^:]+)\s*$/\1/')"
          if [[ "$compose_version" != "$dockerfile_version" ]]; then
            echo "::error file=docker-compose.yml::Image-Tag '$compose_version' passt nicht zu PHOTOCRAFT_VERSION '$dockerfile_version' im Dockerfile" >&2
            exit 1
          fi

      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei Docker Hub anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags und Labels erzeugen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || 'local' }}/${{ env.IMAGE_NAME }}
          # <major.minor> und latest nur für die Version aus dem Dockerfile, damit ein
          # manueller Build einer älteren Version diese Tags nicht zurücksetzt
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ inputs.photocraft_version == '' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.photocraft_version == '' }}
          # Sonst ersetzt die Action diese Labels aus dem Dockerfile durch Daten dieses Repos
          labels: |
            org.opencontainers.image.title=PhotoCraft Web
            org.opencontainers.image.description=Self-hosted PhotoCraft WebAssembly build served by nginx
            org.opencontainers.image.source=https://github.com/storytold/photocraft

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHOTOCRAFT_VERSION=${{ steps.ver.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
